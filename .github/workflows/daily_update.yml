name: Daily Academy Note

# Creates one dated note page per day under academy/modules/<year>/FSE/ and
# links it from that year's note index.
#
# This lives at the repository root because GitHub only runs workflows from
# .github/workflows/ at the root — under academy/.github/workflows/ it was
# inert. It is separate from Daily Learning Generator: that one produces the
# topic-rotating pages (<date>-<topic>.html), this one produces the free-form
# daily note (<date>-note.html).

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Note date as YYYY-MM-DD. Defaults to today (UTC)."
        required: false
        default: ""
# Scheduled runs are paused. Between March and September 2026 they produced 183
# pages and not one was ever written in, so the site filled with empty templates
# that no page linked to. Re-enable the cron below when the notes are actually
# being written; until then use "Run workflow" to scaffold a page on demand.
#  schedule:
    # 07:00 UTC daily
#   - cron: "0 7 * * *"

# Without this the default GITHUB_TOKEN is read-only and the push fails.
permissions:
  contents: write

concurrency:
  group: daily-academy-note
  cancel-in-progress: false

jobs:
  add_note:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create today's note
        id: note
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          python <<'PY'
          import os, re
          from datetime import datetime, timezone
          from pathlib import Path

          raw = (os.getenv("INPUT_DATE") or "").strip()
          if raw:
              if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", raw):
                  raise SystemExit(f"date must be YYYY-MM-DD, got {raw!r}")
              today = raw
          else:
              today = datetime.now(timezone.utc).strftime("%Y-%m-%d")

          # Derive the year from the note's own date. The previous version had
          # 2025 hard-coded, so every 2026 note landed in the 2025 folder.
          year = today[:4]
          fse = Path("academy") / "modules" / year / "FSE"
          fse.mkdir(parents=True, exist_ok=True)

          page = fse / f"{today}-note.html"
          index = fse / "notes-index.html"

          # Emitted on the shared janaka.me design system — no local stylesheet.
          html = f"""<!DOCTYPE html>
          <html lang="en" data-theme="light">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Daily note — {today}</title>
            <link rel="canonical" href="https://janaka.me/academy/modules/{year}/FSE/{today}-note.html" />

            <script>
              (function(){{
                try {{
                  var t = localStorage.getItem("jp-theme");
                  if (t === "dark" || (!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)) {{
                    document.documentElement.setAttribute("data-theme", "dark");
                  }}
                }} catch (e) {{}}
              }})();
            </script>

            <link rel="preconnect" href="https://fonts.googleapis.com" />
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
            <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
            <link rel="stylesheet" href="/assets/css/theme.css" />
            <link rel="stylesheet" href="/assets/css/subsite.css" />
          </head>
          <body>

          <div data-include="/partials/site-nav.html"></div>

          <main>
            <article class="sec subhero">
              <div class="wrap">
                <p class="eyebrow"><a href="/academy/" style="color:inherit;text-decoration:none">&larr; Academy</a></p>
                <div class="prose">
                  <h1>Daily note — {today}</h1>
                  <p class="sub">Free-form log for {today}. Written by hand; the file is
                     scaffolded automatically so the day always has somewhere to go.</p>

                  <blockquote>Capture one thing worth remembering, in enough detail
                  that it is still useful in six months.</blockquote>

                  <h2>What I worked on</h2>
                  <p><em>Replace with the day's work.</em></p>

                  <h2>What I learned</h2>
                  <p><em>One idea, stated plainly.</em></p>

                  <h2>Commands and snippets</h2>
                  <pre><code># worth keeping</code></pre>

                  <h2>Open questions</h2>
                  <ul><li><em>What is still unclear?</em></li></ul>
                </div>
              </div>
            </article>
          </main>

          <footer class="sitefoot">
            <div class="wrap">
              <span>&copy; <span id="year"></span> Janaka Academy</span>
              <span><a href="/academy/">Academy</a> &middot; <a href="/">janaka.me</a></span>
            </div>
          </footer>

          <script src="/assets/js/includes.js"></script>
          <script src="/assets/js/site-nav.js"></script>
          </body>
          </html>
          """

          # The index pages carry the same chrome as every other page: theme.css
          # plus subsite.css, the shared nav partial and the shared footer. The
          # previous notes index emitted bare HTML with no stylesheet at all.
          INDEX_TEMPLATE = """<!DOCTYPE html>
          <html lang="en" data-theme="light">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>{heading} &mdash; {year}</title>
            <meta name="description" content="{lede}" />
            <link rel="canonical" href="https://janaka.me/academy/modules/{year}/FSE/{slug}.html" />

            <script>
              (function(){{
                try {{
                  var t = localStorage.getItem("jp-theme");
                  if (t === "dark" || (!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)) {{
                    document.documentElement.setAttribute("data-theme", "dark");
                  }}
                }} catch (e) {{}}
              }})();
            </script>

            <link rel="preconnect" href="https://fonts.googleapis.com" />
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
            <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
            <link rel="stylesheet" href="/assets/css/theme.css" />
            <link rel="stylesheet" href="/assets/css/subsite.css" />
          </head>
          <body>

          <div data-include="/partials/site-nav.html"></div>

          <main>
            <section class="sec subhero">
              <div class="wrap">
                <p class="eyebrow"><a href="/academy/" style="color:inherit;text-decoration:none">&larr; Academy</a></p>
                <h1>{heading} &mdash; {year}</h1>
                <p class="lede">{lede}</p>
              </div>
            </section>

            <section class="sec">
              <div class="wrap">
                <ul class="loglist">
                </ul>
              </div>
            </section>
          </main>

          <footer class="sitefoot">
            <div class="wrap">
              <span>&copy; <span id="year"></span> Janaka Academy</span>
              <span><a href="/academy/">Academy</a> &middot; <a href="/">janaka.me</a></span>
            </div>
          </footer>

          <script src="/assets/js/includes.js"></script>
          <script src="/assets/js/site-nav.js"></script>
          </body>
          </html>
          """

          # An index written before this template existed has no .loglist anchor.
          # Rebuild it rather than silently doing nothing - that silent no-op is
          # exactly what orphaned every page the old nav-block splice produced.
          def ensure_anchor(html, template_kwargs):
              anchor = '<ul class="loglist">'
              if anchor in html:
                  return html
              carried = re.findall(r"<li>.*?</li>", html, re.S)
              html = INDEX_TEMPLATE.format(**template_kwargs)
              for old in reversed(carried):
                  html = html.replace(anchor, anchor + "\n      " + old.strip(), 1)
              print(f"rebuilt the index on the design system, carrying {len(carried)} entries")
              return html


          created = False
          if page.exists():
              print(f"note already exists, leaving it alone: {page}")
          else:
              page.write_text(html, encoding="utf-8")
              created = True
              print(f"created {page}")

          # Keep a per-year index so notes are never orphaned. Newest first.
          # This used to emit bare HTML with no stylesheet, no nav and no footer,
          # which made it the only page on the site off the design system.
          entry = f'      <li><a href="{page.name}"><strong>{today}</strong></a></li>'

          if index.exists():
              index_html = index.read_text(encoding="utf-8")
          else:
              index_html = INDEX_TEMPLATE.format(
                  year=year,
                  slug="notes-index",
                  heading="Daily notes",
                  lede="A free-form daily log: what was worked on, what was learned, the commands worth keeping and the questions still open.",
              )

          index_html = ensure_anchor(index_html, {"year": year, "slug": "notes-index", "heading": "Daily notes", "lede": "A free-form log, one entry per day."})

          # Compare on the href, not the whole line, so re-runs cannot double up.
          if f'href="{page.name}"' not in index_html:
              anchor = '<ul class="loglist">'
              index_html = index_html.replace(anchor, anchor + "\n" + entry, 1)
              index.write_text(index_html, encoding="utf-8")
              print(f"indexed in {index}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"date={today}\n")
              fh.write(f"created={'true' if created else 'false'}\n")
          PY

      - name: Commit and push
        env:
          # Read from the step output — shell variables do not survive between
          # steps, which is why the old commit message was always empty.
          NOTE_DATE: ${{ steps.note.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add academy/modules

          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi

          git commit -m "Add daily academy note for ${NOTE_DATE}"
          git push
