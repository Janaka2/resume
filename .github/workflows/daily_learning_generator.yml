name: Daily Learning Generator

# Generates the topic-rotating daily page under academy/modules/<year>/FSE/,
# appends it to that year's learning-log.md, and links it from the year's
# "Elite Full-Stack Engineering" page between the DAILY_LINKS markers.
#
# Lives at the repository root: GitHub only runs workflows from
# .github/workflows/ at the root, so under academy/ this never fired.

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Page title"
        required: false
        default: ""
      topic:
        description: "Topic slug, e.g. linux-cli or spring-boot"
        required: false
        default: ""
# Scheduled runs are paused. Between March and September 2026 they produced 183
# pages and not one was ever written in, so the site filled with empty templates
# that no page linked to. Re-enable the cron below when the notes are actually
# being written; until then use "Run workflow" to scaffold a page on demand.
#  schedule:
#   # Runs every day at 05:17 UTC
#   - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: daily-learning-generator
  cancel-in-progress: false

jobs:
  generate-daily-page:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate daily page and update navigation
        env:
          INPUT_TITLE: ${{ inputs.title }}
          INPUT_TOPIC: ${{ inputs.topic }}
        run: |
          python <<'PY'
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote

          today = datetime.now(timezone.utc).strftime("%Y-%m-%d")

          # The year comes from the date. This used to be hard-coded to 2025,
          # so every 2026 page was written into the 2025 folder.
          year = today[:4]
          FSE_DIR = Path("academy") / "modules" / year / "FSE"
          FSE_DIR.mkdir(parents=True, exist_ok=True)

          title = (os.getenv("INPUT_TITLE") or "").strip()
          topic = (os.getenv("INPUT_TOPIC") or "").strip()

          topic_pool = [
              ("Linux CLI Mastery", "linux-cli"),
              ("Spring Boot Deep Dive", "spring-boot"),
              ("Microservices Design", "microservices"),
              ("React Patterns", "react"),
              ("Kafka Fundamentals", "kafka"),
              ("AI Integration", "ai-integration"),
              ("DevOps and Cloud", "devops-cloud"),
              ("Java Core Refresh", "java-core"),
          ]

          if not title or not topic:
              day_num = int(datetime.now(timezone.utc).strftime("%d"))
              auto_title, auto_topic = topic_pool[(day_num - 1) % len(topic_pool)]
              title = title or auto_title
              topic = topic or auto_topic

          def slugify(text):
              text = re.sub(r"[^a-z0-9]+", "-", text.strip().lower())
              return re.sub(r"-+", "-", text).strip("-") or "daily-note"

          topic_slug = slugify(topic)
          file_name = f"{today}-{topic_slug}.html"
          page_path = FSE_DIR / file_name

          # Resolve the year's main page by globbing. Its real filename contains
          # a NON-BREAKING HYPHEN (U+2011); the old literal used a plain "-", so
          # it never matched: the back-link 404'd and the nav block never updated.
          candidates = sorted(FSE_DIR.glob("Elite-Full*Stack-Engineering-*-Edition.html"))
          main_page = candidates[0] if candidates else None
          back_href = quote(main_page.name) if main_page else "/academy/"
          back_text = "Back to FSE main page" if main_page else "Back to Academy"

          # Pages are emitted on the shared janaka.me design system: theme.css
          # plus subsite.css, the shared nav partial and the shared footer.
          # Nothing here carries its own stylesheet any more.
          html = f"""<!DOCTYPE html>
          <html lang="en" data-theme="light">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>{title} - {today}</title>
            <link rel="canonical" href="https://janaka.me/academy/modules/{year}/FSE/{quote(file_name)}" />

            <script>
              (function(){{
                try {{
                  var t = localStorage.getItem("jp-theme");
                  if (t === "dark" || (!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)) {{
                    document.documentElement.setAttribute("data-theme", "dark");
                  }}
                }} catch (e) {{}}
              }})();
            </script>

            <link rel="preconnect" href="https://fonts.googleapis.com" />
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
            <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
            <link rel="stylesheet" href="/assets/css/theme.css" />
            <link rel="stylesheet" href="/assets/css/subsite.css" />
          </head>
          <body>

          <div data-include="/partials/site-nav.html"></div>

          <main>
            <article class="sec subhero">
              <div class="wrap">
                <p class="eyebrow"><a href="./{back_href}" style="color:inherit;text-decoration:none">&larr; {back_text}</a></p>
                <div class="prose">
                  <h1>{title}</h1>
                  <p class="sub">{today} · {topic_slug}</p>

                  <blockquote>Capture one useful thing learned today, in a way that is
                  easy to revisit later.</blockquote>

                  <h2>What I learned</h2>
                  <p><em>Add today's learning notes here.</em></p>

                  <h2>Key commands / examples</h2>
                  <pre><code># add examples here</code></pre>

                  <h2>Practical takeaways</h2>
                  <ul>
                    <li><em>First takeaway.</em></li>
                    <li><em>Second takeaway.</em></li>
                  </ul>
                </div>
              </div>
            </article>
          </main>

          <footer class="sitefoot">
            <div class="wrap">
              <span>&copy; <span id="year"></span> Janaka Academy</span>
              <span><a href="/academy/">Academy</a> &middot; <a href="/">janaka.me</a></span>
            </div>
          </footer>

          <script src="/assets/js/includes.js"></script>
          <script src="/assets/js/site-nav.js"></script>
          </body>
          </html>
          """

          if page_path.exists():
              print(f"page already exists, leaving it alone: {page_path}")
          else:
              page_path.write_text(html, encoding="utf-8")
              print(f"generated {page_path}")

          # The index pages carry the same chrome as every other page: theme.css
          # plus subsite.css, the shared nav partial and the shared footer. The
          # previous notes index emitted bare HTML with no stylesheet at all.
          INDEX_TEMPLATE = """<!DOCTYPE html>
          <html lang="en" data-theme="light">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>{heading} &mdash; {year}</title>
            <meta name="description" content="{lede}" />
            <link rel="canonical" href="https://janaka.me/academy/modules/{year}/FSE/{slug}.html" />

            <script>
              (function(){{
                try {{
                  var t = localStorage.getItem("jp-theme");
                  if (t === "dark" || (!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)) {{
                    document.documentElement.setAttribute("data-theme", "dark");
                  }}
                }} catch (e) {{}}
              }})();
            </script>

            <link rel="preconnect" href="https://fonts.googleapis.com" />
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
            <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
            <link rel="stylesheet" href="/assets/css/theme.css" />
            <link rel="stylesheet" href="/assets/css/subsite.css" />
          </head>
          <body>

          <div data-include="/partials/site-nav.html"></div>

          <main>
            <section class="sec subhero">
              <div class="wrap">
                <p class="eyebrow"><a href="/academy/" style="color:inherit;text-decoration:none">&larr; Academy</a></p>
                <h1>{heading} &mdash; {year}</h1>
                <p class="lede">{lede}</p>
              </div>
            </section>

            <section class="sec">
              <div class="wrap">
                <ul class="loglist">
                </ul>
              </div>
            </section>
          </main>

          <footer class="sitefoot">
            <div class="wrap">
              <span>&copy; <span id="year"></span> Janaka Academy</span>
              <span><a href="/academy/">Academy</a> &middot; <a href="/">janaka.me</a></span>
            </div>
          </footer>

          <script src="/assets/js/includes.js"></script>
          <script src="/assets/js/site-nav.js"></script>
          </body>
          </html>
          """

          # An index written before this template existed has no .loglist anchor.
          # Rebuild it rather than silently doing nothing - that silent no-op is
          # exactly what orphaned every page the old nav-block splice produced.
          def ensure_anchor(html, template_kwargs):
              anchor = '<ul class="loglist">'
              if anchor in html:
                  return html
              carried = re.findall(r"<li>.*?</li>", html, re.S)
              html = INDEX_TEMPLATE.format(**template_kwargs)
              for old in reversed(carried):
                  html = html.replace(anchor, anchor + "\n      " + old.strip(), 1)
              print(f"rebuilt the index on the design system, carrying {len(carried)} entries")
              return html


          # ---- index page ---------------------------------------------------
          # This used to splice an <li> into the Elite page between the
          # DAILY_LINKS markers, matching the literal string "<ul>". The 2026
          # rebuild changed that element to <ul class="grid" ...>, so the match
          # silently failed and every page generated after it was orphaned.
          # The generator now owns one index page instead of editing curated
          # markup, and the Elite page carries a single static link to it.
          index_path = FSE_DIR / "learning-index.html"
          entry = f'      <li><a href="{quote(file_name)}"><strong>{today}</strong> &middot; {title}</a></li>'

          if index_path.exists():
              index_html = index_path.read_text(encoding="utf-8")
          else:
              index_html = INDEX_TEMPLATE.format(
                  year=year,
                  slug="learning-index",
                  heading="Daily learning pages",
                  lede="One page per day, each on the day&rsquo;s topic.",
              )

          index_html = ensure_anchor(index_html, {"year": year, "slug": "learning-index", "heading": "Daily learning pages", "lede": "One page per day, each on the day&rsquo;s topic."})

          # Match on the href, not the whole line, so a re-run cannot duplicate.
          if f'href="{quote(file_name)}"' not in index_html:
              anchor = '<ul class="loglist">'
              index_html = index_html.replace(anchor, anchor + "\n" + entry, 1)
              index_path.write_text(index_html, encoding="utf-8")
              print(f"indexed in {index_path}")
          else:
              print("already indexed")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add academy/modules

          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi

          git commit -m "Add daily learning page"
          git push
