<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Janaka Premathilaka — CV has moved to janaka.me/resume/</title>
<!--
  Redirect stub. The visual CV that used to live at this address now lives at
  resume/index.html and is served from https://janaka.me/resume/ — a clean,
  shareable URL. This file only exists so links shared before the move keep
  working; do not put content here.
-->
<meta name="robots" content="noindex">
<link rel="canonical" href="https://janaka.me/resume/">
<meta http-equiv="refresh" content="0; url=/resume/">
<script>
  (function(){
    try {
      var t = localStorage.getItem("jp-theme");
      if (t === "dark" || (!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    } catch (e) {}
    try { location.replace("/resume/" + location.hash); } catch (e) {}
  })();
</script>
<style>
  :root{--bg:#FAFAF8;--tx:#16181D;--tx2:#6B7079;--ac:#2F4A6D}
  html[data-theme="dark"]{--bg:#0F1114;--tx:#ECEDEF;--tx2:#9A9FA8;--ac:#9BB4D6}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);
       font:400 1rem/1.6 "IBM Plex Sans",system-ui,sans-serif;text-align:center;padding:24px}
  p{color:var(--tx2)} a{color:var(--ac)}
</style>
</head>
<body>
  <p>The CV has moved to <a href="/resume/">janaka.me/resume/</a>.</p>
</body>
</html>
