spring.application.name=momentum-planner
server.port=8766

# The MCP server: one Streamable HTTP endpoint, tools found by scanning @McpTool beans
spring.ai.mcp.server.name=momentum-planner
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.instructions=Tools for AI-drafted daily plans. Call get_plan_contract before drafting, validate_plan after drafting, and save_plan only once validate_plan says valid.

# Where saved plans go
planner.store=plans
